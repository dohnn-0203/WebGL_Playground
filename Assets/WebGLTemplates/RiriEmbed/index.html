<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#17191f">
  <title>미니게임 천국</title>
  <style>
    :root { color-scheme: dark; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Malgun Gothic", sans-serif; background: #17191f; color: #f2f1f7; }
    * { box-sizing: border-box; }
    html, body, .player { width: 100%; height: 100%; margin: 0; overflow: hidden; }
    .player { position: relative; }
    [hidden] { display: none !important; }
    #unity-canvas { display: block; width: 100%; height: 100%; background: #17191f; touch-action: none; }
    #unity-canvas:focus { outline: none; }
    #unity-canvas:focus-visible { outline: 2px solid #bca6ff; outline-offset: -2px; }
    .overlay { position: absolute; inset: 0; display: grid; place-items: center; padding: 20px; background: #17191f; overflow: auto; }
    .card { width: min(100%, 360px); text-align: center; }
    h1, h2 { margin: 0; font-size: clamp(16px, 3vw, 22px); line-height: 1.5; word-break: keep-all; }
    p { margin: 12px 0 0; color: #b8becb; font-size: 14px; line-height: 1.7; word-break: keep-all; }
    progress { display: block; width: 100%; height: 6px; margin-top: 22px; appearance: none; border: 0; border-radius: 3px; overflow: hidden; background: #30313f; accent-color: #bca6ff; }
    progress::-webkit-progress-bar { background: #30313f; }
    progress::-webkit-progress-value { background: #bca6ff; }
    progress::-moz-progress-bar { background: #bca6ff; }
    button { min-height: 40px; padding: 8px 14px; border: 1px solid #bca6ff; border-radius: 5px; font: inherit; font-size: 14px; color: #17191f; background: #bca6ff; cursor: pointer; }
    button:focus-visible { outline: 2px solid #fff; outline-offset: 3px; }
    #retry { margin-top: 18px; }
    .no-script { position: absolute; inset: 30% 20px auto; text-align: center; }
    @media (max-height: 260px) { .overlay { padding: 12px; } .description { display: none; } progress { margin-top: 12px; } p { margin-top: 8px; } }
  </style>
</head>
<body>
  <main class="player" aria-label="미니게임 천국 플레이어">
    <canvas id="unity-canvas" width="960" height="600" tabindex="0" aria-label="머지 카페, 수박게임, 버블슈터. 게임을 선택해 플레이하세요."></canvas>
    <section class="overlay" id="loading" aria-labelledby="loading-title" aria-busy="true">
      <div class="card">
        <h1 id="loading-title">미니게임을 불러오는 중입니다</h1>
        <p class="description">첫 실행에는 시간이 걸릴 수 있어요.</p>
        <progress id="progress" max="1" value="0" aria-label="게임 로딩 진행률"></progress>
        <p id="progress-label" role="status">준비 중</p>
      </div>
    </section>
    <section class="overlay" id="error" aria-labelledby="error-title" hidden>
      <div class="card" role="alert">
        <h2 id="error-title">게임을 불러오지 못했어요</h2>
        <p id="error-message">인터넷 연결을 확인하고 다시 시도해 주세요.</p>
        <button type="button" id="retry">다시 불러오기</button>
      </div>
    </section>
    <noscript><p class="no-script">게임을 실행하려면 브라우저에서 JavaScript를 허용해 주세요.</p></noscript>
  </main>
  <script>
    'use strict';
    (() => {
      const canvas = document.getElementById('unity-canvas');
      const loading = document.getElementById('loading');
      const errorPanel = document.getElementById('error');
      const progress = document.getElementById('progress');
      const progressLabel = document.getElementById('progress-label');
      let unityInstance = null;
      let stopped = false;
      let failed = false;
      let lastPercent = -1;

      function showError(message, detail) {
        if (stopped || failed) return;
        failed = true;
        loading.hidden = true;
        loading.setAttribute('aria-busy', 'false');
        document.getElementById('error-message').textContent = message;
        errorPanel.hidden = false;
        canvas.tabIndex = -1;
        if (detail) console.error('Mini game player:', detail);
      }

      const buildUrl = 'Build';
      const loaderUrl = buildUrl + '/{{{ LOADER_FILENAME }}}';
      const config = {
        dataUrl: buildUrl + '/{{{ DATA_FILENAME }}}',
        frameworkUrl: buildUrl + '/{{{ FRAMEWORK_FILENAME }}}',
        codeUrl: buildUrl + '/{{{ CODE_FILENAME }}}',
#if MEMORY_FILENAME
        memoryUrl: buildUrl + '/{{{ MEMORY_FILENAME }}}',
#endif
#if SYMBOLS_FILENAME
        symbolsUrl: buildUrl + '/{{{ SYMBOLS_FILENAME }}}',
#endif
        streamingAssetsUrl: 'StreamingAssets',
        companyName: {{{ JSON.stringify(COMPANY_NAME) }}},
        productName: {{{ JSON.stringify(PRODUCT_NAME) }}},
        productVersion: {{{ JSON.stringify(PRODUCT_VERSION) }}},
        matchWebGLToCanvasSize: true,
        devicePixelRatio: Math.min(window.devicePixelRatio || 1, 2),
        showBanner(message, type) {
          if (type === 'error') showError('게임을 실행하지 못했어요. 다시 불러오거나 최신 브라우저에서 시도해 주세요.', message);
          else console.warn('Mini game player:', message);
        }
      };

      const script = document.createElement('script');
      script.src = loaderUrl;
      script.onerror = () => showError('게임 파일을 가져오지 못했어요. 인터넷 연결을 확인하고 다시 시도해 주세요.');
      script.onload = async () => {
        if (stopped || failed) return;
        try {
          unityInstance = await createUnityInstance(canvas, config, value => {
            if (stopped || failed) return;
            const amount = Math.min(1, Math.max(0, Number(value) || 0));
            progress.value = amount;
            const percent = Math.round(amount * 100);
            if (percent !== lastPercent) {
              progressLabel.textContent = percent === 100 ? '게임 화면을 준비하고 있어요' : percent + '%';
              lastPercent = percent;
            }
          });
          if (stopped || failed) {
            unityInstance.Quit();
            return;
          }
          loading.hidden = true;
          loading.setAttribute('aria-busy', 'false');
          canvas.focus({ preventScroll: true });
        } catch (error) {
          showError('게임을 실행하지 못했어요. 다시 불러오거나 최신 브라우저에서 시도해 주세요.', error);
        }
      };
      document.body.appendChild(script);

      canvas.addEventListener('pointerdown', () => {
        if (!failed) canvas.focus({ preventScroll: true });
      });
      canvas.addEventListener('contextmenu', event => event.preventDefault());
      // This build pauses on blur. Resume its canvas when the host resizes the
      // iframe, otherwise resizing clears the paused WebGL drawing buffer.
      let lastWidth = canvas.clientWidth;
      let lastHeight = canvas.clientHeight;
      const resizeObserver = new ResizeObserver(() => {
        const width = canvas.clientWidth;
        const height = canvas.clientHeight;
        if (width === lastWidth && height === lastHeight) return;
        lastWidth = width;
        lastHeight = height;
        if (window.self === window.top || !unityInstance || stopped || failed) return;
        requestAnimationFrame(() => {
          if (!stopped && !failed && document.visibilityState === 'visible') {
            canvas.focus({ preventScroll: true });
          }
        });
      });
      resizeObserver.observe(canvas);
      document.getElementById('retry').addEventListener('click', () => window.location.reload());
      window.addEventListener('pagehide', event => {
        if (event.persisted) return;
        stopped = true;
        resizeObserver.disconnect();
        if (unityInstance) unityInstance.Quit();
      });
    })();
  </script>
</body>
</html>
